<meta name="robots" content="noindex">
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chudan AI - Professional Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Top Navigation Bar */
    .navbar {
      width: 100%;
      background-color: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 30px;
      border-bottom: 1px solid #334155;
    }
    .nav-brand {
      font-size: 22px;
      font-weight: bold;
      color: #38bdf8;
    }
    .nav-links {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .nav-item {
      color: #cbd5e1;
      cursor: pointer;
      font-size: 14px;
    }
    .lang-select {
      background-color: #0f172a;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 5px 10px;
      border-radius: 6px;
    }

    /* Main Container */
    .container {
      background-color: #1e293b;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 550px;
      width: 90%;
      text-align: center;
      margin-top: 30px;
      border: 1px solid #334155;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 14px;
      resize: none;
      margin-top: 15px;
    }

    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 14px 24px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      font-weight: bold;
    }

    /* Watermark Remover Wrapper (ይህ የ Pollinations ወተርማርክን ይቆርጠዋል) */
    .img-wrapper {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-height: 400px;
      border-radius: 10px;
      border: 2px solid #38bdf8;
      margin-top: 15px;
      display: none;
    }
    .img-wrapper img {
      width: 100%;
      height: 108%; /* ወተርማርኩን ከስር ለመቁረጥ የታችኛውን ክፍል ይገፋል */
      object-fit: cover;
      margin-bottom: -8%;
    }

    .watermark-overlay {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #38bdf8;
    }

    .loader { display: none; margin: 20px 0; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="nav-brand">🎬 Chudan AI</div>
    <div class="nav-links">
      <span class="nav-item">መነሻ (Home)</span>
      <select id="langSelect" class="lang-select">
        <option value="am">አማርኛ</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="container">
    <h1>Chudan AI Generator</h1>
    <p style="color: #94a3b8; font-size: 14px;">የሚፈልጉትን ሀሳብ ያስገቡ</p>
    
    <textarea id="promptInput" placeholder="ምሳሌ፦ በህዋ ውስጥ የሚጨፍር ሮቦት..."></textarea>
    
    <button onclick="generateAIContent()">ፍጠር (Generate)</button>

    <div id="loader" class="loader">⏳ Chudan AI እየሰራ ነው... እባክዎን ይጠብቁ...</div>

    <div id="imgWrapper" class="img-wrapper">
      <img id="resultImg" src="" alt="AI Output">
      <div class="watermark-overlay">Chudan AI</div>
    </div>
  </div>

  <script>
    async function translateToEnglish(text) {
      try {
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=am|en`);
        const data = await response.json();
        return data.responseData.translatedText || text;
      } catch (error) { return text; }
    }

    async function generateAIContent() {
      const promptInput = document.getElementById('promptInput').value;
      const loader = document.getElementById('loader');
      const imgWrapper = document.getElementById('imgWrapper');
      const resultImg = document.getElementById('resultImg');

      if (!promptInput.trim()) {
        alert("እባክዎን ሀሳብ ያስገቡ!");
        return;
      }

      loader.style.display = 'block';
      imgWrapper.style.display = 'none';

      try {
        const translatedPrompt = await translateToEnglish(promptInput);
        const encodedPrompt = encodeURIComponent(translatedPrompt);
        const randomSeed = Math.floor(Math.random() * 99999);
        
        const generatedUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${randomSeed}&width=800&height=800`;

        resultImg.src = generatedUrl;
        resultImg.onload = () => {
          loader.style.display = 'none';
          imgWrapper.style.display = 'block';
        };

      } catch (error) {
        alert("ስህተት ተፈጥሯል!");
        loader.style.display = 'none';
      }
    }
  </script>

<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"480c9d8468c44ad3bed3c74fbcc6d6f3","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
